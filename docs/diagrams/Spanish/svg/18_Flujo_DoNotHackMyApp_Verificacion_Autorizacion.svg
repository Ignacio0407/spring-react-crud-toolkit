nción checkAuth]</text><text x="38" y="259.308" fill="#000" font-size="11" textLength="288.696">typeof checkAuth === "function" &amp;&amp; requiredAuth?</text><rect x="49.266" y="299.21" width="266.164" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.266" y="320.349" fill="#000" font-size="12" textLength="246.164">userHasAuth = checkAuth(requiredAuth)</text><polygon points="370.696,243.5,588.242,243.5,600.242,255.5,588.242,267.5,370.696,267.5,358.696,255.5,370.696,243.5" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="483.469" y="277.71" fill="#000" font-size="11" textLength="73.643">sí [Permitido]</text><text x="370.696" y="259.308" fill="#000" font-size="11" textLength="217.545">requiredAuth &amp;&amp; checkAuth === true?</text><rect x="409.85" y="299.21" width="139.238" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="419.85" y="320.349" fill="#000" font-size="12" textLength="119.238">userHasAuth = true</text><polygon points="840.377,243.5,1173.782,243.5,1185.782,255.5,1173.782,267.5,840.377,267.5,828.377,255.5,840.377,243.5" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1011.08" y="277.71" fill="#000" font-size="11" textLength="83.73">sí [Por defecto]</text><text x="840.377" y="259.308" fill="#000" font-size="11" textLength="333.405">requiredAuth &amp;&amp; actualUser &amp;&amp; checkAuth === undefined?</text><text x="1185.782" y="252.906" fill="#000" font-size="11" textLength="144.203">no requerido o sin usuario</text><rect x="620.242" y="299.21" width="665.767" height="146.266" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M909.312,299.21 L909.312,308.507 L899.312,318.507 L620.242,318.507" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="623.242" y="313.206" fill="#000" font-size="14" textLength="279.07">c